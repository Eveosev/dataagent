# DataAgent iface identity baseline.
#
# The contract identity packages live in the agent-kernel repository under
# products/iface-identity/ (read-only for DataAgent). This file pins the ten
# iface/<name> packages that DataAgent compares against, together with the
# agent-kernel commit they were read from. Update it only after pulling
# agent-kernel and re-reading that directory; `packages/iface-*` is no longer
# maintained and is not a baseline.
