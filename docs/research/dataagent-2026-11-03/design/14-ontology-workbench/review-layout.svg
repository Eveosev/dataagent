<rect x="1162" y="505" width="378" height="90" rx="7" fill="#fff" stroke="#d7dfe9"/><circle cx="1183" cy="531" r="8" fill="#fff" stroke="#9eabbc"/><text x="1203" y="536" class="bold">1,260.00 元</text><text x="1203" y="561" class="muted small">ERP / 原值 126,000 分 ÷ 100</text><text x="1203" y="582" class="blue small">查看原始响应与转换</text>
<text x="1163" y="628" class="label">补充说明或纠正值</text><rect x="1162" y="642" width="378" height="66" rx="6" fill="#fafbfd" stroke="#d7dfe9"/><text x="1175" y="669" class="muted small">例如：按采购单含税总额核对……</text>
<text x="1163" y="741" class="label small">本次生效范围：仅采购单 PO-1042</text>
<rect x="1162" y="758" width="378" height="44" rx="7" fill="#e4eaf3"/><text x="1266" y="787" fill="#6b7c94" class="bold">保存当前对象纠正</text>
<text x="1163" y="833" class="blue small">补充证据　　　保留待核实</text>
<text x="1163" y="867" class="blue small">修改同类输入映射　→　先预览影响</text>
<text x="39" y="945" class="muted">审核确认、映射变更、业务定义修订分别记录；数据发布使用固定版本及审核范围。</text>
<text x="39" y="975" class="muted small">来源材料　↔　业务字段　↔　问题与纠正　｜　所有操作由服务端核对权限、范围和目标修订。</text>
