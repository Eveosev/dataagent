<rect x="510" y="751" width="590" height="59" rx="7" fill="#f3f6fa"/><text x="526" y="777" class="bold small">来源扩展属性　2 项　▾</text><text x="526" y="798" class="muted small">保留原字段、原值和来源；可单独提出定义修订。</text>
