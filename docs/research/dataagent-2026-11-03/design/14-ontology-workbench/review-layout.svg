<rect x="1280" y="88" width="128" height="52" rx="9" fill="#fff8e9"/><text x="1298" y="109" class="muted small">待审核</text><text x="1375" y="128" class="bold amber">6</text>
<rect x="1420" y="88" width="140" height="52" rx="9" fill="#fff0ed"/><text x="1438" y="109" class="muted small">存在冲突</text><text x="1527" y="128" class="bold" fill="#a34235">2</text>
