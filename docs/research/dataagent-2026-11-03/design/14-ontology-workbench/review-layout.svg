<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">多源本体对象审核工作台界面草图</title>
<desc id="desc">三栏布局：左侧来源采购订单，中间统一业务对象与字段，右侧金额冲突核对及仅对当前对象生效的纠正。全部为示例数据。</desc>
<defs><style>
text{font-family: "PingFang SC", "Microsoft YaHei", sans-serif;fill:#17243c;font-size:16px}
.muted{fill:#68778d;font-size:14px}.small{font-size:13px}.label{font-size:14px;fill:#52627a}.title{font-size:28px;font-weight:650}.section{font-size:19px;font-weight:600}.bold{font-weight:600}.blue{fill:#2459c6}.amber{fill:#995800}.white{fill:#fff}.line{stroke:#e3e8f0;stroke-width:1}.card{fill:#fff;stroke:#dfe5ee;stroke-width:1}.green{fill:#16785a}
</style></defs>
<rect width="1600" height="1000" fill="#f3f5f9"/>
<rect width="1600" height="64" fill="#17243c"/>
<text x="36" y="40" class="white bold" font-size="20">DataAgent</text><text x="174" y="40" style="fill:#c8d4eb">多源接入 / 业务对象</text>
<rect x="1390" y="18" width="172" height="30" rx="15" fill="#33435d"/><text x="1414" y="39" style="fill:#e0e8f7" class="small">界面草图 · 示例数据</text>
<text x="38" y="115" class="title">采购业务 · 对象核对</text><text x="39" y="145" class="muted">接入批次：采购单与 ERP 数据核对　 /　业务定义：采购管理　 /　当前范围：本批次</text>
