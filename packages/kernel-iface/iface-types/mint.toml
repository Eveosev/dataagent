[package]
name = "agentcpm/iface-types"
version = "0.1.0"
kind = "bundle"
description = "AgentCPM iface-types 契约（D72；源码 verbatim 自 kernel/iface/src/types）"
license = "Apache-2.0"
repository = "https://codehub.devcloud.cn-north-4.huaweicloud.com/5a5fe37f080d4dcdab39d8b3ea837bb1/agent-kernel.git"
