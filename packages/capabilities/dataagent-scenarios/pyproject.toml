[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataagent-scenarios"
version = "0.1.0"
description = "DataAgent S0 cross-layer scenario tests (test-only): data layer + governance layer under enforcement = enforce"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
authors = [{ name = "AgentOS DataAgent" }]
dependencies = [
  "dataagent-contracts",
  "dataagent-runtime",
  "dataagent-data",
  "dataagent-application",
  "dataagent-governance",
  "pydantic>=2.7,<3",
  "duckdb>=1.0,<2",
  "sqlglot>=25,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv.sources]
dataagent-contracts = { path = "../dataagent-contracts", editable = true }
dataagent-runtime = { path = "../dataagent-runtime", editable = true }
dataagent-data = { path = "../dataagent-data", editable = true }
dataagent-application = { path = "../dataagent-application", editable = true }
dataagent-governance = { path = "../dataagent-governance", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/dataagent_scenarios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
