[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataagent-operations"
version = "0.1.0"
description = "DataAgent API environment discovery and durable workflow execution"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dataagent-contracts",
    "dataagent-runtime",
    "httpx>=0.27,<1",
    "jsonschema>=4.22,<5",
    "referencing>=0.28,<1",
]

[project.scripts]
dataagent-operations = "dataagent_operations.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.uv.sources]
dataagent-contracts = {path="../dataagent-contracts", editable=true}
dataagent-runtime = {path="../dataagent-runtime", editable=true}

[tool.hatch.build.targets.wheel]
packages = ["src/dataagent_operations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../dataagent-scenarios/src"]
addopts = "-q"
