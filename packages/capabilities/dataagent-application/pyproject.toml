[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataagent-application"
version = "0.1.0"
description = "DataAgent application layer: S0 planning (requirement binding, clarification, SQL), execution (expression interpreter, DuckDB), presentation (workbook, report, export)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
authors = [{ name = "AgentOS DataAgent" }]
dependencies = [
  "dataagent-contracts",
  "dataagent-runtime",
  "duckdb>=1.1,<3",
  "sqlglot>=25,<40",
  "openpyxl>=3.1,<4",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1,<2"]
dev = ["pytest>=8"]

[tool.uv.sources]
dataagent-contracts = { path = "../dataagent-contracts", editable = true }
dataagent-runtime = { path = "../dataagent-runtime", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/dataagent_application"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
