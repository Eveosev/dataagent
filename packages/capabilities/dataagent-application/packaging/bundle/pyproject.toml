[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataagent-application"
version = "0.1.0"
description = "DataAgent application layer: S0 capability atoms (13) for planning, execution and presentation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
authors = [{ name = "AgentOS DataAgent" }]
dependencies = [
  "pydantic>=2.7,<3",
  "duckdb>=1.1,<3",
  "sqlglot>=25,<40",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1,<2"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/dataagent_application", "src/dataagent_runtime", "src/dataagent_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
