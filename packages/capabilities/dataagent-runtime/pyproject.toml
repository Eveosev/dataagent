[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataagent-runtime"
version = "0.1.0"
description = "DataAgent shared runtime: invoke, operation registry, storage ports/adapters, InferencePort and DA12.1 enforcement hooks (access recheck, egress check)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
authors = [{ name = "AgentOS DataAgent" }]
dependencies = [
  "dataagent-contracts",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv.sources]
dataagent-contracts = { path = "../dataagent-contracts", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/dataagent_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
