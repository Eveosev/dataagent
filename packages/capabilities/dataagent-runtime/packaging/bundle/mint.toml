[package]
name = "dataagent/runtime"
version = "0.1.0"
kind = "bundle"
description = "DataAgent 共享运行时：invoke、操作注册表、存储端口与 SQLite/内容寻址适配器、版本化表编解码与 DA12.1 enforcement 钩子；自身不带任何 operation"
license = "Apache-2.0"
keywords = ["data", "runtime", "shared", "mcp"]

[requires]
api = "^0.1"

[provides]
mcp_servers = ["dataagent-runtime"]

[capabilities]
exec = ["uv"]
fs.read = ["*"]
fs.write = [".dataagent/**"]

[capabilities.reason]
exec = "uv 按锁定的 Python 项目拉起 MCP stdio 服务；不执行包内其它程序"
"fs.read" = "读取共享 data_root 内容寻址对象"
"fs.write" = "仅在 data_root（默认工作区 .dataagent/）写入内容寻址对象、SQLite 版本库与判定库"

[metadata.runtime]
requires = ["python>=3.11", "uv"]

[metadata.env]
# 07 §2 / W1c: DECLARATION ONLY (W0 §6) — these values document the variables
# the component reads; Mint 0.1.25 does not inject them from here. The host
# injects actual values through the project-level .mcp.json `env` map of the
# server descriptor (see docs/research/dataagent-2026-11-03/w0-seam-specifications.md §6)
# to route all three layers through one content store and version database.
DATAAGENT_WORKSPACE = "工作区根目录（默认当前目录）；组件从该目录解析相对文件引用"
DATAAGENT_DATA_ROOT = "共享 data_root（默认 <workspace>/.dataagent/）：内容寻址对象、SQLite 版本库与判定库；Mint 清空子进程环境后由宿主以自定义 data_root 重新注入"
DATAAGENT_CATALOG_SNAPSHOT = "可选：覆盖注册表快照路径（共享运行时自身无 catalog）"
