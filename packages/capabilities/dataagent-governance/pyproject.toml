[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataagent-governance"
version = "0.1.0"
description = "DataAgent governance and evaluation layer: 6 S0 atoms (access scope, model-context egress, acceptance criteria, sample isolation, business acceptance, grain/merge checks)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
authors = [{ name = "AgentOS DataAgent" }]
dependencies = [
  "dataagent-contracts",
  "dataagent-runtime",
  "pydantic>=2.7,<3",
  "duckdb>=1.0,<2",
  "sqlglot>=25,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv.sources]
dataagent-contracts = { path = "../dataagent-contracts", editable = true }
dataagent-runtime = { path = "../dataagent-runtime", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/dataagent_governance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
