# 评测治理层包的来源快照。发布制品必须能追溯到这三个输入，而不是“当时的工作区”。
schema = 1

[upstream]
repository = "AgentOS"
kernel = "agent-kernel@f0fa521"
research = "docs/research/dataagent-2026-11-03"

[catalog]
