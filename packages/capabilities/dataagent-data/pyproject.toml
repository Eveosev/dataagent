[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataagent-data"
version = "0.1.0"
description = "DataAgent data layer: S0 capability atoms (32) for judgment and compute flows"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
authors = [{ name = "AgentOS DataAgent" }]
dependencies = [
  "dataagent-contracts",
  "dataagent-runtime",
  "dataagent-ocr",
  "pydantic>=2.7,<3",
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3,<2"]
dev = ["pytest>=8"]

[tool.uv.sources]
dataagent-contracts = { path = "../dataagent-contracts", editable = true }
dataagent-runtime = { path = "../dataagent-runtime", editable = true }
dataagent-ocr = { path = "../dataagent-ocr", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/dataagent_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
