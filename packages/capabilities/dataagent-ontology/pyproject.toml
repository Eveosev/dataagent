[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="dataagent-ontology"
version="0.1.0"
requires-python=">=3.11,<3.14"
dependencies=["dataagent-contracts","dataagent-runtime","pydantic>=2.7,<3","jsonschema>=4.26,<5","referencing>=0.37,<1"]
[project.optional-dependencies]
dev=["pytest>=8"]
[tool.uv.sources]
dataagent-contracts={path="../dataagent-contracts",editable=true}
dataagent-runtime={path="../dataagent-runtime",editable=true}
[tool.hatch.build.targets.wheel]
packages=["src/dataagent_ontology"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
pythonpath=["src"]
